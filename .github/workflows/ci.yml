name: CI - PSScriptAnalyzer, Pester & Validations

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  test-and-lint:
    name: Lint, Test & Validate
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate errors_db.json Syntax
        shell: pwsh
        run: |
          Write-Host "Checking syntax of errors/errors_db.json..."
          $jsonPath = "./errors/errors_db.json"
          if (-not (Test-Path $jsonPath)) {
            Write-Error "errors_db.json not found!"
            exit 1
          }
          try {
            $content = Get-Content $jsonPath -Raw | ConvertFrom-Json
            Write-Host "errors_db.json is valid JSON containing $(($content.PSObject.Properties | Measure-Object).Count) entries."
          }
          catch {
            Write-Error "JSON syntax error in errors_db.json: $_"
            exit 1
          }

      - name: Install PSScriptAnalyzer & Pester
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -Repository PSGallery
          }
          if (-not (Get-Module -ListAvailable -Name Pester)) {
            Install-Module -Name Pester -Force -Scope CurrentUser -Repository PSGallery -SkipPublisherCheck
          }

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Write-Host "Running PSScriptAnalyzer on all .ps1 scripts..."
          $results = Invoke-ScriptAnalyzer -Path ./scripts -Recurse -Severity Error, Warning
          
          if ($results) {
            $results | Format-Table -AutoSize
            $errors = $results | Where-Object { $_.Severity -eq "Error" }
            if ($errors.Count -gt 0) {
              Write-Error "PSScriptAnalyzer found $($errors.Count) Error-level issue(s)!"
              exit 1
            }
            Write-Host "PSScriptAnalyzer completed with 0 errors." -ForegroundColor Green
          } else {
            Write-Host "All scripts passed PSScriptAnalyzer cleanly!" -ForegroundColor Green
          }

      - name: Run Pester Automated Tests
        shell: pwsh
        run: |
          Write-Host "Invoking Pester Automated Test Suite..."
          $pesterResult = Invoke-Pester -Path ./tests -PassThru
          if ($pesterResult.FailedCount -gt 0) {
            Write-Error "Pester failed with $($pesterResult.FailedCount) test failure(s)!"
            exit 1
          }
          Write-Host "All $($pesterResult.PassedCount) Pester tests PASSED!" -ForegroundColor Green

      - name: Validate Batch Scripts
        shell: cmd
        run: |
          echo Validating batch scripts existence and header checks...
          for %%f in (scripts\*.bat) do (
            echo Checking %%f...
            type %%f | findstr /i "WindowsFixKit" >nul || (echo Missing header in %%f && exit /b 1)
          )
          echo All batch scripts validated.
