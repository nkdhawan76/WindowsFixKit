name: CI - Quality Gate, Linting & Automated Tests

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  zero-error-gate:
    name: Zero-Error Quality Gate (Linter, Pester, Markdown)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate errors_db.json Schema & Structure
        shell: pwsh
        run: |
          Write-Host "Validating errors/errors_db.json syntax and integrity..."
          $jsonPath = "./errors/errors_db.json"
          if (-not (Test-Path $jsonPath)) {
            Write-Error "errors_db.json is missing!"
            exit 1
          }
          try {
            $json = Get-Content $jsonPath -Raw | ConvertFrom-Json
            $count = ($json.PSObject.Properties | Measure-Object).Count
            Write-Host "Success: errors_db.json parsed with $count entries."
          }
          catch {
            Write-Error "JSON validation error: $_"
            exit 1
          }

      - name: Install PSScriptAnalyzer & Pester Modules
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -Repository PSGallery
          }
          if (-not (Get-Module -ListAvailable -Name Pester)) {
            Install-Module -Name Pester -Force -Scope CurrentUser -Repository PSGallery -SkipPublisherCheck
          }

      - name: Run Zero-Tolerance PSScriptAnalyzer
        shell: pwsh
        run: |
          Write-Host "Running PSScriptAnalyzer (Severity: Error, Warning)..."
          $results = Invoke-ScriptAnalyzer -Path ./scripts -Recurse -Severity Error, Warning
          
          if ($results) {
            Write-Host "PSScriptAnalyzer findings:" -ForegroundColor Red
            $results | Format-Table -AutoSize
            Write-Error "Zero-tolerance quality gate failed: $($results.Count) linting finding(s) detected!"
            exit 1
          }
          Write-Host "Success: 0 errors and 0 warnings found by PSScriptAnalyzer!" -ForegroundColor Green

      - name: Setup Node.js for Markdown Linting
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run markdownlint-cli2
        run: |
          npx -y markdownlint-cli2 "**/*.md" "#node_modules"

      - name: Run Pester Automated Tests
        shell: pwsh
        run: |
          Write-Host "Invoking Pester Automated Test Suite..."
          $pesterResult = Invoke-Pester -Path ./tests -PassThru
          if ($pesterResult.FailedCount -gt 0) {
            Write-Error "Pester failed with $($pesterResult.FailedCount) test failure(s)!"
            exit 1
          }
          Write-Host "All $($pesterResult.PassedCount) Pester tests PASSED!" -ForegroundColor Green

      - name: Validate Batch Scripts
        shell: cmd
        run: |
          echo Validating batch scripts existence and header checks...
          for %%f in (scripts\*.bat *.bat) do (
            echo Checking %%f...
            type %%f | findstr /i "WindowsFixKit" >nul || (echo Missing header in %%f && exit /b 1)
          )
          echo All batch scripts validated.
