name: Publish to PowerShell Gallery

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-psgallery:
    name: Publish Module to PSGallery
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Publish Module to PowerShell Gallery
        shell: pwsh
        env:
          PSGALLERY_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          if (-not $env:PSGALLERY_KEY) {
            Write-Warning "PSGALLERY_API_KEY secret is not configured. Skipping PowerShell Gallery publishing step."
            exit 0
          }

          $ver = if (Test-Path "VERSION") { (Get-Content "VERSION" -Raw).Trim() } else { "1.0.0" }
          Write-Host "Updating module manifest version to $ver..."
          Update-ModuleManifest -Path "./WindowsFixKit.psd1" -ModuleVersion $ver

          Write-Host "Publishing WindowsFixKit v$ver to PowerShell Gallery..."
          Publish-Module -Path "." -NuGetApiKey $env:PSGALLERY_KEY -Verbose
          Write-Host "Successfully published WindowsFixKit to PowerShell Gallery!" -ForegroundColor Green
